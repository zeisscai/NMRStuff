[workspace]
resolver = "2"
members = [
    "crates/mnv-core",
    "crates/mnv-formats",
    "crates/mnv-proc",
    "crates/mnv-analysis",
    "crates/mnv-render",
    "crates/mnv-report",
    "crates/mnv-app",
    "crates/mnv-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["mnv contributors"]

[workspace.dependencies]
mnv-core = { path = "crates/mnv-core" }
mnv-formats = { path = "crates/mnv-formats" }
mnv-proc = { path = "crates/mnv-proc" }
mnv-analysis = { path = "crates/mnv-analysis" }
mnv-render = { path = "crates/mnv-render" }
mnv-report = { path = "crates/mnv-report" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustfft = "6"
num-complex = { version = "0.4", features = ["serde"] }
eframe = "0.37"
egui = "0.37"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
