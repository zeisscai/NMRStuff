[workspace]
resolver = "2"
members = [
    "crates/nmrstuff-core",
    "crates/nmrstuff-formats",
    "crates/nmrstuff-proc",
    "crates/nmrstuff-analysis",
    "crates/nmrstuff-render",
    "crates/nmrstuff-report",
    "crates/nmrstuff-app",
    "crates/nmrstuff-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["NMRStuff contributors"]

[workspace.dependencies]
nmrstuff-core = { path = "crates/nmrstuff-core" }
nmrstuff-formats = { path = "crates/nmrstuff-formats" }
nmrstuff-proc = { path = "crates/nmrstuff-proc" }
nmrstuff-analysis = { path = "crates/nmrstuff-analysis" }
nmrstuff-render = { path = "crates/nmrstuff-render" }
nmrstuff-report = { path = "crates/nmrstuff-report" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustfft = "6"
num-complex = { version = "0.4", features = ["serde"] }
eframe = "0.37"
egui = "0.37"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
